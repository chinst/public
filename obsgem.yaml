openapi: 3.0.0
info:
  title: Obsidian Note Search API
  version: "1.0.0"
servers:
  - url: https://your-server.example.com/ # 배포된 서버 주소 입력
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
paths:
  /search:
    get:
      summary: Search Obsidian Notes
      security:
        - ApiKeyAuth: [AIzaSyDmYAMP]
      parameters:
        - name: query
          in: query
          required: true
          description: "검색어. 'tag:태그명' 구문 사용 가능."
          schema:
            type: string
      responses:
        '200':
          description: A summary of the found notes.
